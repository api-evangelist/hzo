aid: hzo
name: HZO
description: >-
  HZO is a protective coating company specializing in Parylene and thin-film conformal
  coatings that safeguard electronics from moisture, humidity, salt fog, corrosion, and
  harsh chemicals. Founded in Salt Lake City and now headquartered in Raleigh, North
  Carolina, HZO delivers turnkey coating services and manufacturing solutions across
  consumer electronics, automotive and mobility, industrial, medical device, IoT, and
  battery markets, with coating facilities and centers of excellence in the United States,
  Hungary, China, and Vietnam. HZO is a physical-materials and contract-manufacturing
  business ("Protection from the Inside Out") rather than a software vendor: it publishes
  no public developer program, API, or machine-readable API contract. This profile records
  the public web hygiene surface it does serve — an llms.txt discovery file, an RFC 9116
  security.txt, and domain security posture.
